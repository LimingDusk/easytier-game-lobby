name: Windows build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/RoomChecks.csproj
      - run: dotnet run --project tests/updates/UpdateChecks.csproj
      - run: dotnet run --project tests/window/WindowChecks.csproj -- previews
      - uses: actions/upload-artifact@v4
        with:
          name: GameLobby-WPF-previews
          path: previews/*.png
      - name: Build standalone launcher
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'easytier.zip'
          Invoke-WebRequest 'https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-windows-x86_64-v2.6.4.zip' -OutFile $archive
          dotnet publish src/GameLobby.csproj -c Release -r win-x64 --self-contained true "-p:EngineArchive=$archive" -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Rename-Item dist/GameLobby.exe GameLobby-win-x64.exe
          Expand-Archive $archive "$env:RUNNER_TEMP/engine"
          $core = Get-ChildItem "$env:RUNNER_TEMP/engine" -Recurse -Filter easytier-core.exe
          $help = & $core.FullName --help | Out-String
          foreach ($flag in '--dhcp','--network-name','--peers','--rpc-portal','--enable-udp-broadcast-relay','ET_NETWORK_SECRET') {
            if (!$help.Contains($flag)) { throw "Missing option $flag" }
          }
          & (Join-Path $core.DirectoryName 'easytier-cli.exe') peer --help
          if ($LASTEXITCODE) { throw 'Missing peer diagnostics' }
      - run: dotnet run --project tests/window/WindowChecks.csproj -- --update-package dist/GameLobby-win-x64.exe
      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist/GameLobby-win-x64.exe)).ProductVersion
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "The release tag does not match the executable product version."
          }
          dotnet run --project scripts/update-manifest/UpdateManifest.csproj -- dist/GameLobby-win-x64.exe "$tag" dist/GameLobby-win-x64.blocks.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GameLobby-win-x64
          path: |
            dist/GameLobby-win-x64.exe
            dist/GameLobby-win-x64.blocks.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameLobby-win-x64
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="$tag"
          flags=(--verify-tag --generate-notes)
          if [[ "${tag%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            title="${tag%.0}"
          fi
          gh release create "$tag" GameLobby-win-x64.exe GameLobby-win-x64.blocks.json --repo "$GITHUB_REPOSITORY" --title "$title" "${flags[@]}"
